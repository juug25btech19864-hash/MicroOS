[package]
name = "microos-gui-kernel"
version = "1.0.0"
edition = "2021"
authors = ["MicroOS Team"]
license = "MIT"
description = "MicroOS Lightweight Graphical Desktop Operating System in 100% Rust"

[dependencies]
bootloader_api = "0.11.17"
x86_64 = "0.15"
spin = "0.9.8"
uart_16550 = "0.3.0"
pic8259 = "0.10.4"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.10.5"
volatile = "0.4.6"

[package.metadata.bootloader]
map-physical-memory = true

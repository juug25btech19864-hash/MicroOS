# GNU GRUB Configuration for MicroOS
# Supports both Legacy BIOS (El Torito) and UEFI (x86_64)

set default="0"
set timeout=2

# Terminal settings
terminal_input console
terminal_output console

# Visual theme
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

insmod part_gpt
insmod part_msdos
insmod ext2
insmod fat
insmod iso9660

menuentry "MicroOS v2.0 (Standard Boot)" {
    linux /boot/vmlinuz quiet loglevel=3 console=tty0 console=ttyS0,115200
    initrd /boot/initramfs.cpio.gz
}

menuentry "MicroOS v2.0 (Verbose / Diagnostics Mode)" {
    linux /boot/vmlinuz debug loglevel=7 console=tty0 console=ttyS0,115200 earlyprintk=vga
    initrd /boot/initramfs.cpio.gz
}

menuentry "MicroOS v2.0 (Emergency Rescue Shell)" {
    linux /boot/vmlinuz single init=/bin/sh console=tty0 console=ttyS0,115200 loglevel=7
    initrd /boot/initramfs.cpio.gz
}

menuentry "Reboot System" {
    reboot
}

menuentry "Power Off" {
    halt
}

# GNU GRUB Configuration for MicroOS
# Supports both Legacy BIOS (El Torito) and UEFI (x86_64)

set default="0"
set timeout=3

# Visual theme
set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan

insmod part_gpt
insmod part_msdos
insmod ext2
insmod fat
insmod iso9660

menuentry "MicroOS v1.0 (Standard Boot)" {
    set gfxpayload=keep
    echo "Loading MicroOS Linux Kernel..."
    linux /boot/vmlinuz quiet loglevel=3 console=tty0 console=ttyS0,115200
    echo "Loading MicroOS Initramfs..."
    initrd /boot/initramfs.cpio.gz
}

menuentry "MicroOS v1.0 (Verbose / Diagnostics Mode)" {
    echo "Loading MicroOS Linux Kernel (Verbose)..."
    linux /boot/vmlinuz debug console=tty0 console=ttyS0,115200 earlyprintk=vga
    echo "Loading MicroOS Initramfs..."
    initrd /boot/initramfs.cpio.gz
}

menuentry "MicroOS v1.0 (Emergency Rescue Shell)" {
    echo "Loading MicroOS Linux Kernel (Rescue)..."
    linux /boot/vmlinuz single init=/bin/sh console=tty0 console=ttyS0,115200
    echo "Loading MicroOS Initramfs..."
    initrd /boot/initramfs.cpio.gz
}

menuentry "Reboot System" {
    echo "Rebooting..."
    reboot
}

menuentry "Power Off" {
    echo "Powering off..."
    halt
}
